name: ci

# Tests for everything this repository ships to other people: the npm CLI and
# MCP server (packages/undominated-check), the dominated-warn action, and the
# scripts that keep the public face current. Offline — no step reads the live
# site, so a red run here is a code fault, never a moved catalogue. The
# catalogue drift check is figures-current.yml.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The engines floor, the current 22 line, and the Active LTS.
        node: ['22.12', '22', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}

      - name: Tests (CLI, MCP server, action, scripts)
        run: npm test

      - name: One version everywhere it ships
        run: node packages/undominated-check/prepublish.mjs

      - name: The npm tarball holds only bin, src and docs
        working-directory: packages/undominated-check
        run: |
          npm pack --dry-run --json > pack.json
          node -e '
            const [{ files }] = JSON.parse(require("fs").readFileSync("pack.json", "utf8"))
            const bad = files.map((f) => f.path).filter((p) => !/^(bin|src)\/|^(README|CHANGELOG)\.md$|^LICENSE$|^package\.json$/.test(p))
            if (bad.length) { console.error("unexpected files in the tarball:", bad); process.exit(1) }
            console.log(files.length + " files, all expected")
          '
