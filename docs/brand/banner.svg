  <line x1="56" y1="318" x2="1144" y2="318" stroke="#2A2823" stroke-width="1"/>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="start">
    <text x="56" y="350" fill="#A39E93" font-size="11" letter-spacing="0.08em">UNDOMINATED</text>
