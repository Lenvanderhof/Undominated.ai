  <!-- Step-field mark: graphite mass with the two-rung cut. Chartreuse only in the void. -->
  <g transform="translate(56 86)">
    <path fill="#FBFAF8" d="M0 248 V124 H124 V0 H248 V248 Z"/>
    <rect x="132" y="8" width="108" height="108" fill="#83B81D"/>
