name: refresh public face

# figures-current.yml proves the README, hero, floor table, dump references and
# version pins agree with their sources. This one does the fix it asks for: it
# runs the same generators in write mode and opens (or updates) one pull
# request with the result. Merging that pull request is the human accept; this
# workflow never pushes to main.
#
# Owner setup, once: Settings → Actions → General → "Allow GitHub Actions to
# create and approve pull requests". A pull request opened with GITHUB_TOKEN does
# not start other workflows; re-run figures-current from the PR if you want the
# check to show on it.

on:
  schedule:
    # After the site's daily refresh and the 09:41 figures check.
    - cron: '17 10 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh-public-face
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write # the bot/refresh-public-face branch
      pull-requests: write
    env:
      BRANCH: bot/refresh-public-face
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Regenerate every derived figure
        run: |
          node scripts/refresh-readme.mjs
          node scripts/build-hero.mjs
          node scripts/build-floor-table.mjs
          node scripts/dump-current.mjs
          node scripts/pins-current.mjs

      - name: Open or update the pull request
        run: |
          if git diff --quiet; then
            echo "Everything already agrees with its source."
            exit 0
          fi
          AS_OF="$(grep -o '<!--fig:asOf-->[0-9-]*' README.md | head -n 1 | sed 's/.*-->//')"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch --create "$BRANCH"
          git commit --all --message "docs: regenerate the public face against the ${AS_OF} board" \
            --message "Generated by .github/workflows/refresh-public-face.yml. No figure was typed."
          git push --force origin "$BRANCH"
          {
            echo "Regenerated from the live catalogue, as of **${AS_OF}**. Nothing here was typed by hand."
            echo
            echo '```'
            git diff --stat HEAD~1
            echo '```'
            echo
            echo "Screenshots are not regenerated; \`scripts/shots-current.mjs\` says when they need a reshoot."
          } > "$RUNNER_TEMP/body.md"
          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr edit "$BRANCH" --title "docs: public face as of ${AS_OF}" --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr create --head "$BRANCH" --base main --title "docs: public face as of ${AS_OF}" --body-file "$RUNNER_TEMP/body.md"
          fi
