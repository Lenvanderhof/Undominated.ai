name: public resource checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Installer and claim boundaries
        run: npm test --prefix packages/undominated-check
      - name: Read-only MCP and price provenance
        run: npm test --prefix packages/undominated-mcp
      - name: Public pull-request action contract
        run: node --test actions/dominated-warn/index.test.mjs
