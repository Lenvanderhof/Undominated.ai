  <text x="348" y="214" fill="#FBFAF8" opacity="0.72" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="500" letter-spacing="-0.3">Best first. Then price.</text>
